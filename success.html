<!doctype html>
<html lang="sv" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tack | Syrian Gold</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            text-align: center;
            background: linear-gradient(rgba(16, 24, 13, .8), rgba(16, 24, 13, .93)), url("assets/hero.jpg") center/cover no-repeat;
            color: #f4f0e6;
            font-family: Arial, sans-serif
        }

        .box {
            width: min(810px, 100%);
            padding: 65px 35px;
            background: rgba(23, 35, 21, .94);
            border: 1px solid rgba(190, 122, 20, .65);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .45)
        }

        .checkmark {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            margin: 0 auto 25px;
            border: 1px solid #be7a14;
            border-radius: 50%;
            color: #d9972e;
            font-size: 30px
        }

        h1 {
            margin: 0 0 24px;
            font: 400 clamp(42px, 7vw, 64px)/1.15 Georgia, serif
        }

        p {
            max-width: 620px;
            margin: auto;
            color: #c9cec4;
            font-size: 17px;
            line-height: 1.9
        }

        .home-button {
            display: inline-block;
            margin-top: 32px;
            padding: 16px 28px;
            background: #be7a14;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600
        }
    </style>
</head>

<body>
    <main class="box">
        <div class="checkmark" aria-hidden="true">✓</div>
        <h1 id="successTitle">Tack for ditt meddelande</h1>
        <p id="successMessage">Ditt meddelande har skickats. Vi aterkommer sa snart som mojligt.</p><a
            class="home-button" id="homeButton" href="index.html">Tillbaka till startsidan</a>
    </main>
    <script>"use strict"; const t = { sv: { pageTitle: "Tack | Syrian Gold", title: "Tack för ditt meddelande", message: "Ditt meddelande har skickats. Vi återkommer så snart som möjligt.", button: "Tillbaka till startsidan" }, en: { pageTitle: "Thank you | Syrian Gold", title: "Thank you for your message", message: "Your message has been sent successfully. We will contact you as soon as possible.", button: "Return to the homepage" }, ar: { pageTitle: "شكراً لك | Syrian Gold", title: "شكراً لك على رسالتك", message: "تم إرسال رسالتك بنجاح. سنتواصل معك في أقرب وقت ممكن.", button: "العودة إلى الصفحة الرئيسية" } }; const lang = t[localStorage.getItem("sglang")] ? localStorage.getItem("sglang") : "sv"; document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; document.title = t[lang].pageTitle; document.getElementById("successTitle").textContent = t[lang].title; document.getElementById("successMessage").textContent = t[lang].message; document.getElementById("homeButton").textContent = t[lang].button;</script>
</body>

</html>
